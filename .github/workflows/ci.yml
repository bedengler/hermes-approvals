name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: uv run --extra test pytest -q
      - run: node --check dashboard/dist/index.js
      - run: git diff --check
      - run: uv build
