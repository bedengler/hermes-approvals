[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-approval-api"
version = "0.1.0"
description = "Profile-scoped, versioned approval API foundation for Hermes plugins"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.100"]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.24"]

[dependency-groups]
test = ["pytest>=7", "httpx>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["hermes_approval*", "dashboard*"]

[tool.setuptools.package-dir]
"" = "src"
dashboard = "dashboard"

[tool.setuptools.package-data]
dashboard = ["manifest.json", "dist/index.js"]
